<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぺてんと ネット詐欺・ウイルスシミュレーション</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="logo">ぺてんと シミュレーション</div>
    <nav class="nav-links">
        <a href="#">ホーム</a>
        <a href="#">使い方</a>
        <a href="#">お問い合わせ</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">体験する詐欺の種類を選ぶ</h1>

    <!-- 詐欺体験カード -->
    <div class="card-grid">

        <!-- フィッシング -->
         <div class="scam-card">
            <div class="card-icon">💳</div>
            <h2>フィッシング詐欺</h2>
            <div class="card-hover-desc">
                <p>偽のメールやSMSから偽サイトに誘導し、個人情報を入力させる手口を体験します。</p>
            </div>
            <button class="btn-primary">体験する</button>
         </div>

        <!-- 偽セキュリティ警告 -->
        <div class="scam-card">
            <div class="card-icon">⚠️</div>
            <h2>偽セキュリティ警告</h2>
            <div class="card-hover-desc">
                <p>「ウイルスに感染しました」という画面と警告音で焦らせる手口を体験します。</p>
            </div>
            <button class="btn-primary">体験する</button>
        </div>

        <!-- 偽懸賞 -->
        <div class="scam-card">
            <div class="card-icon">🎁</div>
            <h2>偽懸賞・当選詐欺</h2>
            <div class="card-hover-desc">
                <p>「豪華賞品が当たった」と見せかけて、不審な登録サイトに誘導する手口を体験します。</p>
            </div>
            <button class="btn-primary">体験する</button>
        </div>

    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 黄巻がみ</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
